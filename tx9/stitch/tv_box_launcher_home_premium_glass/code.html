<!-- Script para simular interatividade suave do foco do controle remoto (D-Pad) -->
<script data-purpose="tv-dpad-navigation">
    document.addEventListener('DOMContentLoaded', () => {
      const focusableElements = Array.from(document.querySelectorAll('[tabindex="0"], button'));
      let currentFocusIndex = 0;

      // Suporte para teclas de seta do controle remoto / teclado
      window.addEventListener('keydown', (e) => {
        if (['ArrowRight', 'ArrowLeft'].includes(e.key)) {
          e.preventDefault();
          if (e.key === 'ArrowRight') {
            currentFocusIndex = (currentFocusIndex + 1) % focusableElements.length;
          } else if (e.key === 'ArrowLeft') {
            currentFocusIndex = (currentFocusIndex - 1 + focusableElements.length) % focusableElements.length;
          }
          focusableElements[currentFocusIndex].focus();
        }
      });
    });
  </script>
<!-- END: RemoteControlSimulationScript -->
